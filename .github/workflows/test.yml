name: test

on: [push, pull_request]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [google-bridge, searxng, hackernews, github, chat-scraper]
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: |
          for f in tools/${{ matrix.tool }}/*.py tools/${{ matrix.tool }}/scrapers/*.py 2>/dev/null; do
            [ -f "$f" ] && python3 -m py_compile "$f" || true
          done
      - name: Bash syntax check
        run: |
          for f in tools/${{ matrix.tool }}/*.sh; do
            [ -f "$f" ] && bash -n "$f" || true
          done
