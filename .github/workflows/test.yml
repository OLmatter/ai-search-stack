name: test

on: [push, pull_request]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: |
          python3 -m py_compile search_helper.py
          python3 -m py_compile auto_select_node.py
      - name: Bash syntax check
        run: |
          bash -n start_search_helper.sh
          bash -n start_mihomo.sh
          bash -n example_config.sh
