# 关键：search.formats 必须含 json，否则 client 拿不到 JSON（公网实例默认禁 JSON 的原因）
use_default_settings: true
server:
  limiter: false      # 本机实例，关闭 bot 检测，否则 urllib 客户端会被 429
  image_proxy: false
search:
  formats:
    - html
    - json
# v3.15 上游引擎调优（2026-09-16 doctor 标定）：长期不健康引擎暂时禁用，
# 不让它们拖慢每次搜索（每个不健康引擎都要等满 timeout 才判死）。
#   brave      too many requests
#   duckduckgo CAPTCHA
#   startpage  parsing error
# （三者均见 2026-09-16 调优前实测输出；属上游侧问题，本实例配置修不了，
#   先禁用止损，恢复方法见下）
# disabled: true = 默认搜索不调度（实例偏好页仍可单独开启做观察）。
# 恢复方法：注释掉对应条目 → docker compose restart → python tools/doctor.py
# 观察 unresponsive_engines 是否清零后再放回。
#
# v3.16 恢复观察（2026-09-16，观察后维持禁用）：enabled_engines 单发探活
# 三引擎全部通过（brave 21 / duckduckgo 21 / startpage 20 条，unresponsive
# 均空），但按恢复方法回滚启用 + restart 后首次聚合搜索三引擎即全部复发
# （brave too many requests / duckduckgo CAPTCHA / startpage parsing error
# —— doctor 21 条结果同场实测）。结论：单发探活通过 ≠ 可回滚，上游侧
# 仍不稳定，恢复判据必须是 restart 后聚合搜索 unresponsive 清零。
# 再次评估时先单发探活，再回滚 + restart 实测，两关都过才放回。
#
# v3.17 恢复复跑（2026-09-16 晚，第一关即未过，维持禁用）：engines= 参数
# 单发探活三发（预算 3/5）全部复发——brave too many requests / duckduckgo
# CAPTCHA / startpage parsing error，rows 均 0，与 v3.16 回滚后聚合复发
# 症状逐字一致。较 v3.16 更强：这次连单发都不过（上游封锁持续未解除），
# 第二关（回滚启用 + restart 聚合）按两关判据不再执行——必败动作不做，
# 省下预算。两关判据不变：单发 + restart 后聚合 unresponsive 清零，
# 双过才回滚。
#
# v3.18 收尾环复跑（2026-09-16 晚，第一关 2/3 未过，维持禁用）：engines=
# 参数单发探活三发（预算 3/3）——brave too many requests / duckduckgo
# CAPTCHA 复发（与 v3.17 症状逐字一致，封锁持续），startpage 单发恢复
# （10 行，unresponsive 空）。但 v3.16 已实证"单发过 ≠ 可回滚"（当时
# startpage 单发 20 行通过、回滚聚合即 parsing error 复发），故不为
# startpage 单独回滚，第二关不执行；三引擎维持禁用，两关判据不变。
#
# v3.19 判据扩展：回滚粒度从"三引擎整组"细化到"单引擎独立"。
# 背景：三引擎整组判据把可救的引擎和无救的引擎绑死——v3.18 startpage
# 单发已恢复、brave/ddg 仍复发，整组判据下 startpage 只能陪着禁用。
# 单引擎粒度两关（对任一引擎 E 独立执行，互不绑定）：
#   第一关  E 单发探活（engines=E）rows>0 且 unresponsive 空；
#   第二关  settings.yml 仅回滚启用 E（其他禁用引擎保持不动）→
#           docker compose restart → 聚合搜索（默认引擎集）→
#           doctor/结果观察 E 的 unresponsive 清零且 rows 正常。
#   双过 → E 单独放回；E 复发 → 仅 E 再禁用（立即改回），不影响其他
#   引擎的观察状态，第二关消耗照实记账。
# 整组判据保留为退化形态：若所有禁用引擎同一轮全部过两关，等价整组回滚。
# v3.19 复跑 + 单引擎粒度判据首例实证（2026-09-16 晚，预算 4/4）：
#   startpage 两关双过，**单独回滚成功**——第一关单发 10 行 unresponsive
#   空；第二关仅回滚 startpage + docker compose restart 后聚合搜索正常
#   出结果（10 行全部 startpage，unresponsive 无 startpage；google cse
#   自身 timeout 与本判据无关）。startpage disabled: false 维持生效。
#   duckduckgo 第一关恢复（单发 10 行 unresponsive 空，CAPTCHA 未复现
#   ——较 v3.17/v3.18 转好），但第二关因预算用尽未执行；v3.16 已实证
#   "单发过 ≠ 可回滚"，**维持禁用**，下轮复跑优先补 ddg 第二关。
#   brave 单发复发（too many requests，rows=0，与 v3.17/v3.18 症状逐字
#   一致，上游封锁第三轮持续），第一关即未过，第二关不做——必败动作
#   不做，**维持禁用**。
# 整组判据退役：本轮起不再"三引擎整组"评估，各引擎按上方单引擎两关
# 独立走，互不绑定、互不牵连。
# v3.20 第四轮复跑（2026-09-17 早）：brave 第一关通过（19 行 unresponsive
# 空，三连封锁解除）→ 第二关回滚启用；mojeek 首探 access denied 被排除
# （本环境/IP 不可用，替代引擎结论作废，brave 恢复后无需替代）。
# 第二关聚合复发（brave timeout）→ 按单引擎判据立即再禁用。四轮结论：
# brave 的"单发过"不可信（第 4 轮单发 19 行过、聚合即 timeout），其恢复
# 判据需升级（如连续 N 轮单发过才允许第二关），观察继续。
#
# v3.23 第五轮采样（2026-09-16 深夜，预算 4/4：三引擎各 1 发单发探活 +
# 1 发默认聚合确认，四发同题 q="python" 同法逐字可比）。本轮按 v3.20
# 判据升级定位为「连续 gate-1 通过数据积累轮」，不烧第二关预算：
#   brave        第一关过（20 行，unresponsive 空）——v3.20（19 行）后
#                连续第 2 轮单发过（streak=2；更早：v3.16 单发过但聚合即
#                复发，v3.17/3.18/3.19 三连 fail）。「连续 N 轮」的 N 尚未
#                定标——继续积累，N 定标前不烧第二关。
#   duckduckgo   第一关未过（CAPTCHA，rows=0，逐字 v3.15~v3.18/v3.22
#                更正轮症状）→ 诚实 streak 归零（v3.19"恢复"已判假阳性
#                不计入），维持禁用，第二关必败不做。
#   startpage    第一关未过（CAPTCHA，rows=0），且第 4 发默认聚合确认
#                生产路径同病：unresponsive 记 "Suspended: CAPTCHA"
#                （SearXNG 调度器内部已自动暂停该引擎；同场聚合仅
#                wikipedia 1 行，google cse/wikidata timeout 与本判据
#                无关）。两轮三观测（v3.22 记 09-16 晚聚合 parsing error
#                + 本轮探活 CAPTCHA + 聚合 Suspended:CAPTCHA）→ 按
#                v3.15 止损判据（不健康引擎不拖慢每次搜索）禁用；恢复
#                走单引擎两关（其 v3.19 正是经此路径回滚，机制已验证）。
# 探活机制固化（同轮）：searxng_client 新增 engines= 参数与 probe()
# 第一关探活函数——v3.16~v3.23 六轮探活全是 ad-hoc 裸 HTTP（判据在
# settings.yml、调用在各班次习惯里，与 v3.19 acquire 根因同构），
# 下轮起第一关只准走 probe()（机制进库，调用路径唯一）。
#
# v3.24 第六轮采样（2026-09-17 00:2x，预算 4/4：brave 两发 + ddg 一发 +
# 默认聚合一发，四发同题 q="python" 同法逐字可比）。本轮为 probe()
# 实网首用（v3.23 机制进库后首次实网调用，六轮 ad-hoc 技术债清偿）：
#   brave        第一关过 ×2（两发均 20 行 unresponsive 空）——第一发
#                streak 2→3（v3.20/v3.23/v3.24 三连）；第二发为背靠背
#                连发（占 startpage 跳过腾出的名额）：间隔秒级仍 20 行
#                全过 = 限流器至少容忍 2 快速请求，首个非「1 发/轮」
#                粒度的限流数据点。
#   duckduckgo   第一关未过（CAPTCHA，rows=0，逐字 v3.15~v3.18/v3.22/
#                v3.23 症状）→ streak 维持 0（归零后连续第 2 fail），
#                维持禁用。
#   startpage    跳过（v3.23 两轮三观测止损禁用，无待验 streak，观察
#                暂停；恢复仍走单引擎两关）。
#   聚合确认     默认引擎集 20 行全部 google cse（实例级健康，v3.23 的
#                wikipedia 1 行降级态未复现；google cse/wikidata 时好
#                时坏——实例级波动本身即 v3.24 doctor 行数地板立项证据）。
#
# v3.24 N 定标（「连续 N 轮单发过才烧第二关」，证据链定稿）：
#   brave gate-1 全史：v3.16 过(21行)→烧→聚合复发(too many requests)；
#   v3.17/18/19 三连 fail；v3.20 过(19行)→烧→聚合复发(timeout)；
#   v3.23 过(20行)；v3.24 过×2(20行×2 连发)。
#   定标 N=3，判据升级为复合三条（全满足才烧 gate-2）：
#   a) 连续 N=3 轮单发过——streak=1 烧 gate-2 实证 2/2 全失败（上史），
#      N=1 被数据否决；streak≥2 无任何 gate-2 数据点，N=3 是首个未被
#      否决且触手可及的最小值（诚实声明：未被证明，只是未被否决）；
#   b) streak 内至少一轮含背靠背连发 K=2 全过——gate-2 失败症状
#      （too many requests/timeout）是限流，单发 1 发/轮永远采不到
#      限流窗口行为（请求模式不同：1 发/数天 vs 全量搜索持续调度），
#      连发是对失败模式的直接采样（v3.24 首点：2 连发全过）；
#   c) streak 跨度 ≥24h——六个 brave 数据点全部落在 ~3h 窗口内
#      （09-16 晚~09-17 凌晨，一夜多班次使「轮」时间稀释），而
#      v3.15~v3.19 封锁持续一天以上：仅覆盖 3h 的 streak 分不清
#      「解封」与「窗口运气」，24h 下限让采样至少超出封锁时间尺度。
#   brave 现状对照：a) ✅(streak=3) b) ✅(本轮连发) c) ✗(~3h)——
#   资格未齐，**下轮不烧**；跨度满足后（09-18 之前不足 24h）gate-1
#   再过且 c) 达标即可烧 gate-2（回滚启用+restart+聚合 unresponsive
#   清零，判据不变；复发立即再禁用）。
#   「聚合小样本试探」（engines="brave,wikipedia" 显式多引擎一发，
#   不碰 settings 不 restart）评估：比单发更接近聚合调度语境，可作
#   gate-1.5 叠加观测；弊=缺 restart 引擎初始化路径、默认集完整调度
#   仍不同，**不替代 gate-2**；未实网验证前不进库（v3.23 probe() 先例：
#   机制在判据被手动验证多轮后才固化）。
#   时间线勘误：上方 v3.20 段记「2026-09-17 早」系日期笔误——shift_log
#   实录 v3.20 批次 09-16 21:53 收工（深夜补记标注），采样不可能晚于
#   收工，六轮 brave 数据点实际全落 09-16 晚~09-17 凌晨（本条 c) 项
#   依据；原注释照录不改，以此勘误为准）。
#
# v3.25 第七轮采样（2026-09-17 00:51~00:56，预算 5/5：brave 探活 1 +
# ddg 探活 1 + gate-1.5 实网 2 + 默认聚合 1，同题 q="python"）。本轮 =
# 判据 v2 首次实战——第一次按 v2 复合三条裁决「gate-2 烧不烧」：
#   brave        第一关过（00:51:24，20 行 unresponsive 空）——streak
#                3→4（v3.20/23/24/25 四连）。派工书「当前 streak=2、
#                过则 3」系 v3.23 时刻的陈旧计数，以本文件 v3.24 段实录
#                （第一发已 2→3）为准。判据 v2 裁决：a) ✅ streak=4≥3；
#                b) ✅ v3.24 背靠背连发 K=2 全过在案；c) ✗ 跨度不足——
#                streak 起点 v3.20（09-16 21:53 收工前）距本次探活
#                ≤2.9h，v3.23 锚更短（≈1.1h），均 << 24h（上轮预注册
#                「09-18 之前不足 24h」兑现）。**三条不全满足 → gate-2
#                不烧**——c) 条件按设计拦下一次 3h 窗口内的提前烧关
#                （v3.20 正是 ~3h 窗口内单发过、烧关即复发，判据 v2 的
#                c) 就是从那次失败长出来的），复合判据首次实战通过。
#   duckduckgo   第一关未过（00:51:26，CAPTCHA rows=0，逐字 v3.15~
#                v3.18/v3.22/v3.23/v3.24 症状）→ streak 维持 0（归零后
#                连续第 3 fail），维持禁用。
#   startpage    跳过（v3.23 止损禁用观察暂停，同 v3.24）。
#   gate-1.5 实网首验：**未通过，不进库**（v3.24「实网验证前不进库」
#                被实网证据加强）。两发两形态各带混杂因子：
#                ① search(engines="brave,wikipedia") 形态（00:51:54）
#                25 行 = brave 18 + wikipedia 1 + google cse 6——
#                google cse 混入！取证（/config 免费读数，非搜索预算）：
#                实例里 "google cse" 是独立启用引擎（shortcut goc，
#                enabled: true）。根因受控对照钉死（单变量=categories
#                有无）：search() 恒传 categories=general → engines=
#                语义是「默认集 ∪ 点名」；probe() 不传 categories →
#                engines= 严格收窄只调度点名引擎（00:55:03 同 engines=
#                参数无 categories，仅 brave+wikipedia 被调度，google
#                cse 未现）。v3.23「engines= 透传」在两条路径语义不同，
#                此前无文档——本轮文档钉 + 请求形状回归钉落库；行为级
#                变更（search(engines=) 是否应弃 categories 换严格
#                收窄）涉 MCP 工具契约（categories/engines 双参组合），
#                立项留下轮。
#                ② probe 同形态多引擎（00:55:03）0 行 + brave/wikipedia
#                双 timeout——距 brave 上一发过（00:51:24）仅 3 分钟，
#                单观测噪声压倒信号（brave 刚过即 timeout），gate-1.5
#                作判据不可靠。
#   限流第三数据点：brave 4.5 分钟窗口内第 3 发（00:51:24 过 →
#                00:51:54 过 → 00:55:03 timeout）——v3.24 二发秒级连发
#                全过，第 3 发 timeout，限流器容忍边界或在 2~3 发/短窗
#                附近（单点，不定标）。
#   聚合确认     默认聚合（00:55:41）0 行无错误——实例级降级窗口实录
#                （对比 v3.24 同口径 20 行全 google cse；与 00:55:03
#                双 timeout 同窗口）。预算耗尽未复测；SEARXNG_MIN_ROWS=3
#                行数地板（v3.24）正是为这种窗口设计的 ⚠️，下班次
#                doctor 兜底报警。实例级波动非单引擎问题，三引擎禁用
#                状态不因实例级波动调整。
engines:
  - name: brave
    disabled: true
  # duckduckgo 第二关（v3.20）双过：回滚 + restart 后聚合 11 条、
  # unresponsive 仅 google cse（与本判据无关）、无 ddg——回滚生效维持启用。
  # 与 brave 同场对照的价值：brave 聚合即复发、ddg 干净——单发可信度
  # 因引擎而异，判据必须逐引擎走完两关。
  # [v3.22 审计更正，判词作废] 上面 v3.20 的 ddg"两关双过、回滚生效"是
  # 假阳性：当轮 settings.yml 存在重复 ddg 条目（false+true 并存），
  # SearXNG loader 对同名条目依次 update_dict 进同一个默认引擎字典——
  # 后者覆盖前者，实跑时 ddg 根本未被调度（运行实例 /config 探得
  # enabled=False 实证；"unresponsive 无 ddg"是空洞真——禁用的引擎
  # 永远不会进 unresponsive）。测试钉正则取首匹配，对重复条目全盲，
  # 两轮全绿未拦截。v3.22 修复重复条目后诚实重走第二关（restart +
  # 聚合实搜 1 发）：ddg CAPTCHA 复发——与 v3.15~v3.18 上游封锁史
  # 一致，按单引擎判据立即再禁用。ddg 与 brave 同病：单发过不可信，
  # 下轮复评先连续多轮单发过再考虑烧第二关预算。
  - name: duckduckgo
    disabled: true
  # startpage：v3.19 单引擎粒度两关双过单独回滚生效。v3.23 第五轮探活
  # CAPTCHA + 聚合 "Suspended: CAPTCHA"（两轮三观测，见上方 v3.23 段）
  # → 按 v3.15 止损判据禁用，恢复走单引擎两关。
  - name: startpage
    disabled: true
