# 关键：search.formats 必须含 json，否则 client 拿不到 JSON（公网实例默认禁 JSON 的原因）
use_default_settings: true
server:
  limiter: false      # 本机实例，关闭 bot 检测，否则 urllib 客户端会被 429
  image_proxy: false
search:
  formats:
    - html
    - json
# v3.15 上游引擎调优（2026-09-16 doctor 标定）：长期不健康引擎暂时禁用，
# 不让它们拖慢每次搜索（每个不健康引擎都要等满 timeout 才判死）。
#   brave      too many requests
#   duckduckgo CAPTCHA
#   startpage  parsing error
# （三者均见 2026-09-16 调优前实测输出；属上游侧问题，本实例配置修不了，
#   先禁用止损，恢复方法见下）
# disabled: true = 默认搜索不调度（实例偏好页仍可单独开启做观察）。
# 恢复方法：注释掉对应条目 → docker compose restart → python tools/doctor.py
# 观察 unresponsive_engines 是否清零后再放回。
#
# v3.16 恢复观察（2026-09-16，观察后维持禁用）：enabled_engines 单发探活
# 三引擎全部通过（brave 21 / duckduckgo 21 / startpage 20 条，unresponsive
# 均空），但按恢复方法回滚启用 + restart 后首次聚合搜索三引擎即全部复发
# （brave too many requests / duckduckgo CAPTCHA / startpage parsing error
# —— doctor 21 条结果同场实测）。结论：单发探活通过 ≠ 可回滚，上游侧
# 仍不稳定，恢复判据必须是 restart 后聚合搜索 unresponsive 清零。
# 再次评估时先单发探活，再回滚 + restart 实测，两关都过才放回。
#
# v3.17 恢复复跑（2026-09-16 晚，第一关即未过，维持禁用）：engines= 参数
# 单发探活三发（预算 3/5）全部复发——brave too many requests / duckduckgo
# CAPTCHA / startpage parsing error，rows 均 0，与 v3.16 回滚后聚合复发
# 症状逐字一致。较 v3.16 更强：这次连单发都不过（上游封锁持续未解除），
# 第二关（回滚启用 + restart 聚合）按两关判据不再执行——必败动作不做，
# 省下预算。两关判据不变：单发 + restart 后聚合 unresponsive 清零，
# 双过才回滚。
#
# v3.18 收尾环复跑（2026-09-16 晚，第一关 2/3 未过，维持禁用）：engines=
# 参数单发探活三发（预算 3/3）——brave too many requests / duckduckgo
# CAPTCHA 复发（与 v3.17 症状逐字一致，封锁持续），startpage 单发恢复
# （10 行，unresponsive 空）。但 v3.16 已实证"单发过 ≠ 可回滚"（当时
# startpage 单发 20 行通过、回滚聚合即 parsing error 复发），故不为
# startpage 单独回滚，第二关不执行；三引擎维持禁用，两关判据不变。
#
# v3.19 判据扩展：回滚粒度从"三引擎整组"细化到"单引擎独立"。
# 背景：三引擎整组判据把可救的引擎和无救的引擎绑死——v3.18 startpage
# 单发已恢复、brave/ddg 仍复发，整组判据下 startpage 只能陪着禁用。
# 单引擎粒度两关（对任一引擎 E 独立执行，互不绑定）：
#   第一关  E 单发探活（engines=E）rows>0 且 unresponsive 空；
#   第二关  settings.yml 仅回滚启用 E（其他禁用引擎保持不动）→
#           docker compose restart → 聚合搜索（默认引擎集）→
#           doctor/结果观察 E 的 unresponsive 清零且 rows 正常。
#   双过 → E 单独放回；E 复发 → 仅 E 再禁用（立即改回），不影响其他
#   引擎的观察状态，第二关消耗照实记账。
# 整组判据保留为退化形态：若所有禁用引擎同一轮全部过两关，等价整组回滚。
# v3.19 复跑 + 单引擎粒度判据首例实证（2026-09-16 晚，预算 4/4）：
#   startpage 两关双过，**单独回滚成功**——第一关单发 10 行 unresponsive
#   空；第二关仅回滚 startpage + docker compose restart 后聚合搜索正常
#   出结果（10 行全部 startpage，unresponsive 无 startpage；google cse
#   自身 timeout 与本判据无关）。startpage disabled: false 维持生效。
#   duckduckgo 第一关恢复（单发 10 行 unresponsive 空，CAPTCHA 未复现
#   ——较 v3.17/v3.18 转好），但第二关因预算用尽未执行；v3.16 已实证
#   "单发过 ≠ 可回滚"，**维持禁用**，下轮复跑优先补 ddg 第二关。
#   brave 单发复发（too many requests，rows=0，与 v3.17/v3.18 症状逐字
#   一致，上游封锁第三轮持续），第一关即未过，第二关不做——必败动作
#   不做，**维持禁用**。
# 整组判据退役：本轮起不再"三引擎整组"评估，各引擎按上方单引擎两关
# 独立走，互不绑定、互不牵连。
# v3.20 第四轮复跑（2026-09-17 早）：brave 第一关通过（19 行 unresponsive
# 空，三连封锁解除）→ 第二关回滚启用；mojeek 首探 access denied 被排除
# （本环境/IP 不可用，替代引擎结论作废，brave 恢复后无需替代）。
# 第二关聚合复发（brave timeout）→ 按单引擎判据立即再禁用。四轮结论：
# brave 的"单发过"不可信（第 4 轮单发 19 行过、聚合即 timeout），其恢复
# 判据需升级（如连续 N 轮单发过才允许第二关），观察继续。
engines:
  - name: brave
    disabled: true
  # duckduckgo 第二关（v3.20）双过：回滚 + restart 后聚合 11 条、
  # unresponsive 仅 google cse（与本判据无关）、无 ddg——回滚生效维持启用。
  # 与 brave 同场对照的价值：brave 聚合即复发、ddg 干净——单发可信度
  # 因引擎而异，判据必须逐引擎走完两关。
  - name: duckduckgo
    disabled: false
  - name: duckduckgo
    disabled: true
  # startpage：v3.19 单引擎粒度两关双过（第一关单发 10 行 unresponsive
  # 空；第二关仅回滚 + restart 后聚合 10 行全 startpage、unresponsive
  # 无 startpage），单独放回生效
  - name: startpage
    disabled: false
