# 关键：search.formats 必须含 json，否则 client 拿不到 JSON（公网实例默认禁 JSON 的原因）
use_default_settings: true
server:
  limiter: false      # 本机实例，关闭 bot 检测，否则 urllib 客户端会被 429
  image_proxy: false
search:
  formats:
    - html
    - json
# v3.15 上游引擎调优（2026-09-16 doctor 标定）：长期不健康引擎暂时禁用，
# 不让它们拖慢每次搜索（每个不健康引擎都要等满 timeout 才判死）。
#   brave      too many requests
#   duckduckgo CAPTCHA
#   startpage  parsing error
# （三者均见 2026-09-16 调优前实测输出；属上游侧问题，本实例配置修不了，
#   先禁用止损，恢复方法见下）
# disabled: true = 默认搜索不调度（实例偏好页仍可单独开启做观察）。
# 恢复方法：注释掉对应条目 → docker compose restart → python tools/doctor.py
# 观察 unresponsive_engines 是否清零后再放回。
engines:
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: startpage
    disabled: true
